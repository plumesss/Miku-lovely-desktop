<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>初音桌宠 · 设置</title><link rel="stylesheet" href="settings.css"></head><body><main><div class="eyebrow">MIKU DESK PET</div><h1>未来酱的桌面小屋</h1><p class="intro">按你喜欢的样子，陪你度过每一天。</p>
<section><label>桌宠形象<select id="skin"><option value="crayon">蜡笔初音</option><option value="standard">标准初音</option><option value="chibi">Q版初音</option></select></label>
<label>大小 <output id="sizeValue"></output><input type="range" id="size" min="140" max="500" step="10"></label>
<label>透明度 <output id="opacityValue"></output><input type="range" id="opacity" min="0.25" max="1" step="0.05"></label>
<label>语音音量 <output id="volumeValue"></output><input type="range" id="volume" min="0" max="1" step="0.05"></label></section>
<section class="checks"><label><input type="checkbox" id="motion">动态动作</label><label><input type="checkbox" id="sound">初音语音与口型</label><label><input type="checkbox" id="hourly">整点问候</label><label><input type="checkbox" id="login">开机自动启动</label></section>
<section><label>天气所在城市<input id="city" type="text" maxlength="80" placeholder="例如：上海（可留空）"></label><p class="small">城市名发送至 Open-Meteo 查询天气，无需定位权限。</p><label>天气 / 季节特效<select id="weather"><option value="none">关闭</option><option value="sun">晴天</option><option value="rain">下雨</option><option value="snow">下雪</option><option value="stars">流星</option><option value="cherry">樱花</option><option value="maple">枫叶</option></select></label></section>
<div class="buttons"><button id="speech">试听语音口型</button><button id="feed">投喂大葱 🥬</button></div><p id="status" role="status">设置会自动保存。右键桌宠可打开菜单或退出。</p><footer>Hatsune Miku © Crypton Future Media, INC. · 仅限个人非商业使用</footer></main><script src="settings.js"></script></body></html>
